name: test
on: [push, pull_request]
jobs:
  test:
    # macOS: the installer tests use PlistBuddy, ditto and xattr.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: desktop
