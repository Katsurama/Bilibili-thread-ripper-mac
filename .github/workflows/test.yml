name: test
on: [push, pull_request]
jobs:
  test:
    # macOS: the installer tests use PlistBuddy, ditto and xattr.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: desktop
      # The takeover in a real browser: the bundle users get, on a made-up client player.
      - run: npm install --no-save --no-package-lock playwright-core@1.58.2
        working-directory: desktop
      - run: node test/browser.cjs
        working-directory: desktop
        env:
          BTR_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
